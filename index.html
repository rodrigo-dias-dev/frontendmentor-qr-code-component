<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Otimizado -->
  <title>Frontend Mentor | Desafio Componente QR Code</title>
  <meta name="description" content="Solução do desafio QR Code do Frontend Mentor - Desenvolvido por Rodrigo Dias com foco em HTML5 semântico e CSS3.">

  <!-- Google Fonts (Performance Máxima) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">

  <!-- CSS Linkado na pasta Assets -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main>
    <article class="qr-card">
      <img src="assets/images/image-qr-code.png" 
           alt="QR Code para acessar o site Frontend Mentor" 
           class="qr-image">
      
      <div class="qr-content">
        <h1>Melhore suas habilidades front-end construindo projetos</h1>
        <p>Escaneie o código QR para visitar o Frontend Mentor e levar suas habilidades de programação para o próximo nível</p>
      </div>
    </article>
  </main>

  <footer class="attribution">
    <p>Desafio por <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.</p>
    <p>Codificado por <a href="https://github.com/seu-usuario">Rodrigo Dias</a>.</p>
  </footer>

</body>
</html>
