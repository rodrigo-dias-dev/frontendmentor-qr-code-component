<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- META TAGS -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Frontend Mentor | QR Code Component</title>
  <meta name="description"
    content="Solução do desafio QR Code Component do Frontend Mentor desenvolvida com HTML5 e CSS3.">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <main>
    <article class="qr-card">
      <img src="assets/images/image-qr-code.png" alt="QR Code pra acessar o Frontend Mentor class" class="qr-image">
      <div class="qr-content">
        <h1>Improve your front-end skills by building projects</h1>
        <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </article>
  </main>

    <footer class="attribution">

    <p>
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener"
      >
        Frontend Mentor
      </a>.
    </p>

    <p>
      Coded by
      <a
        href="https://github.com/rodrigo-dias-dev"
        target="_blank"
        rel="noopener"
      >
        Rodrigo Dias
      </a>.
    </p>

  </footer>

</body>

</html>
